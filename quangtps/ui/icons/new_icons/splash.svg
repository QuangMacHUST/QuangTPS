<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="title_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0984e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cec9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="10" fill="url(#bg_gradient)" />
  
  <!-- Title -->
  <text x="400" y="150" font-family="Arial" font-size="80" font-weight="bold" fill="url(#title_gradient)" text-anchor="middle" filter="url(#glow)">QuangTPS</text>
  
  <!-- Subtitle -->
  <text x="400" y="210" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">Hệ thống lập kế hoạch xạ trị mã nguồn mở</text>
  
  <!-- Logo Symbol (Atom-like radiation) -->
  <circle cx="400" cy="300" r="60" fill="none" stroke="#0984e3" stroke-width="6" />
  <ellipse cx="400" cy="300" rx="90" ry="30" fill="none" stroke="#0984e3" stroke-width="6" transform="rotate(30 400 300)" />
  <ellipse cx="400" cy="300" rx="90" ry="30" fill="none" stroke="#0984e3" stroke-width="6" transform="rotate(150 400 300)" />
  <circle cx="400" cy="300" r="15" fill="#0984e3" />
  
  <!-- Version text -->
  <text x="400" y="450" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle">Phiên bản 1.0.0</text>
</svg> 